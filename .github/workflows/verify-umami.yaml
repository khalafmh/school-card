name: Verify Umami privacy configuration

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_umami:
    name: Verify tracker and recorder settings
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify tracker integrity and privacy settings
        run: node frontend/scripts/verify-umami-tracker.mjs
